services:
  db:
    image: postgres:16
    container_name: smiv_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smiv_plus
      POSTGRES_USER: ${MYSQL_USER}
      POSTGRES_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MYSQL_USER} -d smiv_plus"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: smiv_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smiv_plus
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      APP_BASE_PATH: /smiv_plus
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smiv_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    profiles: ["cloudflare"]

volumes:
  db_data:
