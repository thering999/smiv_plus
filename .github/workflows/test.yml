name: Test calculation engine

on:
  push:
    branches: [main]
    paths: ['docs/app.js', 'docs/ui.js', 'test/**', 'package.json']
  pull_request:
    branches: [main]
    paths: ['docs/app.js', 'docs/ui.js', 'test/**', 'package.json']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
